name: Update ward data

on:
  schedule:
    - cron: '0 10 * * *'   # daily, about 6am Philadelphia time
  workflow_dispatch:       # "Run workflow" button for an on-demand refresh
  push:
    paths: ['data/appointed.json']   # recount right after an appointment is recorded

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-data.mjs
      - name: Save any changes
        if: always()
        run: |
          git config user.name "ward-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ward-leaders.json data/seats.json
          git diff --cached --quiet || (git commit -m "Update ward data" && git push)

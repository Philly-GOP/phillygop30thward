name: Update ward data

on:
  schedule:
    - cron: '0 10 * * *'   # daily, about 6am Philadelphia time
  workflow_dispatch:       # "Run workflow" button for an on-demand refresh
  push:
    paths: ['data/appointed.json']   # recount right after an appointment is recorded

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-data.mjs
      - name: Save any changes
        if: always()
        run: |
          git config user.name "ward-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ward-leaders.json data/seats.json data/polling.json
          if git diff --cached --quiet; then echo "changed=no" >> "$GITHUB_OUTPUT"; else git commit -m "Update ward data" && git push && echo "changed=yes" >> "$GITHUB_OUTPUT"; fi
        id: save
      # Pushes made by this workflow don't trigger a Pages rebuild on their own, so ask for one.
      - name: Republish the site
        if: always() && steps.save.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
